<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Eigene Traktor-Silhouette, Draufsicht (Front oben), Hintergrund der Bedienpanel-Vorlage "Licht"
       (ControlHub, 21.10.2026). Neutrales Grau, wirkt auf dunklem und hellem Design. Leuchten angedeutet:
       gelb = Fahrlicht vorne, weiß = Arbeitslicht, orange = Blinker/Rundumleuchte, rot = Rücklicht. -->
  <g fill="#9aa3b0" fill-opacity="0.55" stroke="#5f6773" stroke-width="4" stroke-linejoin="round">
    <!-- Frontgewicht -->
    <rect x="715" y="78" width="170" height="44" rx="10"/>
    <!-- Vorderreifen -->
    <rect x="652" y="170" width="58" height="160" rx="18"/>
    <rect x="890" y="170" width="58" height="160" rx="18"/>
    <!-- Vorderachse -->
    <rect x="705" y="236" width="190" height="28" rx="6"/>
    <!-- Motorhaube -->
    <path d="M 732 122 L 868 122 L 878 420 L 722 420 Z"/>
    <!-- Kotflügel hinten -->
    <rect x="610" y="455" width="110" height="250" rx="26"/>
    <rect x="880" y="455" width="110" height="250" rx="26"/>
    <!-- Hinterreifen -->
    <rect x="618" y="470" width="94" height="220" rx="24"/>
    <rect x="888" y="470" width="94" height="220" rx="24"/>
    <!-- Kabine -->
    <rect x="680" y="400" width="240" height="250" rx="22"/>
    <!-- Dach -->
    <rect x="696" y="414" width="208" height="222" rx="16" fill-opacity="0.35"/>
    <!-- Heck/Hubwerk -->
    <rect x="740" y="650" width="120" height="70" rx="10"/>
    <rect x="770" y="720" width="60" height="40" rx="6"/>
  </g>
  <!-- Fahrlicht vorne (gelb) -->
  <circle cx="748" cy="132" r="11" fill="#f5c542"/>
  <circle cx="852" cy="132" r="11" fill="#f5c542"/>
  <!-- Arbeitslicht vorne am Dach (weiß) -->
  <rect x="712" y="404" width="34" height="12" rx="4" fill="#ffffff"/>
  <rect x="854" y="404" width="34" height="12" rx="4" fill="#ffffff"/>
  <!-- Blinker vorne/hinten (orange) -->
  <circle cx="690" cy="412" r="9" fill="#ff9500"/>
  <circle cx="910" cy="412" r="9" fill="#ff9500"/>
  <circle cx="626" cy="700" r="9" fill="#ff9500"/>
  <circle cx="974" cy="700" r="9" fill="#ff9500"/>
  <!-- Rundumleuchte auf dem Dach -->
  <circle cx="800" cy="438" r="14" fill="#ff9500" stroke="#5f6773" stroke-width="3"/>
  <!-- Arbeitslicht hinten am Dach (weiß) -->
  <rect x="712" y="634" width="34" height="12" rx="4" fill="#ffffff"/>
  <rect x="854" y="634" width="34" height="12" rx="4" fill="#ffffff"/>
  <!-- Rücklichter (rot) -->
  <rect x="742" y="712" width="20" height="10" rx="3" fill="#ff3b30"/>
  <rect x="838" y="712" width="20" height="10" rx="3" fill="#ff3b30"/>
</svg>
